<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: #000;
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: #fff;
      }
      /* ambient green gradient — matches --color-mp-primary family */
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(900px 480px at 82% 118%, rgba(0, 128, 0, 0.5), transparent 60%),
          radial-gradient(700px 420px at 8% -12%, rgba(10, 75, 11, 0.55), transparent 62%);
      }
      /* subtle grid texture */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(1100px 700px at 50% 45%, #000 40%, transparent 100%);
      }
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 88px;
        gap: 26px;
      }
      .kicker {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #6ee7a0;
      }
      .kicker::before {
        content: "";
        width: 44px;
        height: 2px;
        background: linear-gradient(90deg, rgb(0, 128, 0), rgb(116, 167, 155));
        border-radius: 2px;
      }
      h1 {
        font-size: 96px;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.02;
      }
      h1 .alias {
        display: block;
        margin-top: 10px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 44px;
        font-weight: 500;
        letter-spacing: 0.02em;
        color: #9df0bb;
      }
      .tagline {
        font-size: 30px;
        font-weight: 500;
        color: #aaa;
        max-width: 820px;
        line-height: 1.35;
      }
      .footer {
        position: absolute;
        bottom: 58px;
        left: 88px;
        right: 88px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 22px;
        color: #8a8a8a;
      }
      .stack {
        display: flex;
        gap: 12px;
      }
      .stack span {
        padding: 8px 18px;
        font-size: 19px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        color: #cfcfcf;
        background: rgba(255, 255, 255, 0.03);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="content">
      <div class="kicker">Full-Stack Developer &amp; UI Specialist</div>
      <h1>
        Wael Alamrany
        <span class="alias">— Mr.Err</span>
      </h1>
      <p class="tagline">Robust system architecture, seamless high-performance interfaces.</p>
    </div>
    <div class="footer">
      <div class="stack">
        <span>React</span><span>TypeScript</span><span>Next.js</span><span>Node.js</span>
      </div>
      <div>mrerr.com</div>
    </div>
  </body>
</html>
