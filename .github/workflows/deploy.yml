name: Deploy to Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # allows GITHUB_TOKEN to pull from GHCR

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          # Pass GITHUB_TOKEN into the SSH session via envs — no PAT needed
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: 13.222.172.60
          username: admin
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN,REPO_OWNER,GITHUB_REPOSITORY
          script: |
            set -euo pipefail

            APP_DIR="/opt/portfolify"
            REPO_URL="https://${REPO_OWNER}:${GHCR_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

            echo "📂 Setting up app directory"
            if [ -d "${APP_DIR}/.git" ]; then
              echo "   → Pulling latest changes"
              git -C "${APP_DIR}" pull origin main
            else
              echo "   → Cloning repository"
              git clone "${REPO_URL}" "${APP_DIR}"
            fi

            cd "${APP_DIR}"

            echo "🔑 Logging into GitHub Container Registry"
            echo "${GHCR_TOKEN}" | docker login ghcr.io \
              -u "${REPO_OWNER}" \
              --password-stdin

            echo "⬇️  Pulling latest image"
            docker compose pull

            echo "🚀 Restarting containers"
            docker compose up -d --remove-orphans

            echo "🧹 Pruning dangling images"
            docker image prune -f

            echo "✅ Deployment complete"
            docker compose ps
